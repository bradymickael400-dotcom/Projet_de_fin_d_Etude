version: '3.8'

services:
  # ── BASE DE DONNÉES (PostgreSQL + TimescaleDB) ──
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: argos_db
    environment:
      POSTGRES_USER: brady
      POSTGRES_PASSWORD: 'brady123'
      POSTGRES_DB: argos
    ports:
      - "5432:5432"
    volumes:
      # Persistance des données (pour ne rien perdre si le conteneur s'arrête)
      - argos_pgdata:/var/lib/postgresql/data
      # Initialisation automatique du schéma au premier démarrage du volume
      - ./init_argos.sql:/docker-entrypoint-initdb.d/init_argos.sql:ro
    restart: unless-stopped

  # ── APPLICATION BACKEND (Flask) & FRONTEND ──
  web:
    build: .
    container_name: argos_web
    ports:
      - "5002:5002"
    environment:
      # Variables d'environnement lues par ton app Python
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      # L'URL de connexion utilise le nom du service "db" ; le nom de la base
      # DOIT correspondre à POSTGRES_DB ci-dessus (argos).
      - DATABASE_URL=postgresql://brady:brady123@db:5432/argos
      - SECRET_KEY=Argos_direction_generale2026
    volumes:
      # Synchronisation en temps réel de ton code local vers le conteneur (Hot-Reload)
      - .:/app
    depends_on:
      - db
    restart: unless-stopped

volumes:
  argos_pgdata: