services:
  db:
    image: postgres:16-alpine
    container_name: arthena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arthena}
      POSTGRES_USER: ${POSTGRES_USER:-arthena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - arthena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arthena} -d ${POSTGRES_DB:-arthena}"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    build:
      context: .
    container_name: arthena-web
    restart: unless-stopped
    environment:
      FLASK_CONFIG: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arthena}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arthena}
      SECRET_KEY: ${ARTHENA_SECRET_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PAYMENT_SIMULATION: ${PAYMENT_SIMULATION:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    ports:
      - "${ARTHENA_PORT:-5006}:5000"
    volumes:
      - arthena_data:/app/instance
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arthena-cloudflared
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://web:5000

  news-updater:
    build:
      context: .
    container_name: arthena-news-updater
    restart: unless-stopped
    environment:
      FLASK_CONFIG: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arthena}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arthena}
      SECRET_KEY: ${ARTHENA_SECRET_KEY:-}
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do flask refresh-news || true; sleep 86400; done"

volumes:
  arthena_data:
    name: arthena-data
  arthena_pgdata:
    name: arthena-pgdata
