{% extends "base.html" %}
{% block content %}
<h1 class="pg-title">Postuler dans une autre école</h1>
<form class="card" data-api-form action="{{ url_for('teacher.apply') }}" data-success="Candidature envoyée." data-reset="true">
  <label>Établissement cible</label>
  <select name="ecole_id" class="inp">
    {% for s in schools %}<option value="{{ s.id }}">{{ s.nom }}</option>{% endfor %}
  </select>
  <label>Matières</label><input name="matieres" class="inp" placeholder="Ex. Maths, Physique" required>
  <label>Lettre de motivation</label><textarea name="motivation" class="inp" rows="5" placeholder="Présentez votre expérience..."></textarea>
  <button class="btn btn-p" type="submit">Envoyer</button>
</form>
{% endblock %}
