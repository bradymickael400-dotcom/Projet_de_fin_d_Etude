<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGOS — Black Box Monitoring Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--bg2:#0d1117;--bg3:#111820;--bg4:#161e2e;
  --panel:#0f1623;--card:#131b27;--card2:#17202f;
  --border:#1e2d42;--border2:#243448;--border3:#2a3d58;
  --text:#e2eaf6;--text2:#8fa3bc;--text3:#5a7290;
  --cyan:#00d4ff;--cyan2:#00a8cc;--cyan3:#007a99;
  --green:#00e676;--green2:#00b85a;--green3:#007a3d;
  --amber:#ffab00;--amber2:#e09000;--amber3:#a06400;
  --red:#ff4444;--red2:#cc2222;--red3:#881111;
  --blue:#2979ff;--blue2:#1a5acc;--blue3:#103d99;
  --purple:#b44dff;--purple2:#8833cc;--purple3:#5c2299;
  --font:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --display:'Orbitron',sans-serif;
  --radius:8px;--radius2:12px;--radius3:16px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --glow:0 0 20px rgba(0,212,255,.15);
  --trans:.2s ease;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
/* SCROLLBARS */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
.login-bg{position:absolute;inset:0;overflow:hidden}
.login-bg::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(0,212,255,.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%)}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:40px 40px}
.login-card{position:relative;width:420px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius3);padding:40px;box-shadow:var(--shadow),var(--glow)}
@media(max-width:480px){.login-card{width:calc(100vw - 32px);padding:28px}}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand{font-family:var(--display);font-size:36px;font-weight:900;color:var(--cyan);letter-spacing:6px;text-shadow:0 0 30px rgba(0,212,255,.4)}
.login-logo .sub{color:var(--text3);font-size:11px;letter-spacing:3px;margin-top:4px;text-transform:uppercase}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.form-group input,.form-group select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color var(--trans)}
.form-group input:focus,.form-group select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,212,255,.1)}
.form-group select option{background:var(--bg3)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--cyan2),var(--blue2));border:none;border-radius:var(--radius);padding:12px;color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;transition:opacity var(--trans);margin-top:8px}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:transparent;border:1px solid var(--border2);border-radius:var(--radius);padding:8px 16px;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;transition:all var(--trans)}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-danger{background:linear-gradient(135deg,var(--red2),#991111);border:none;border-radius:var(--radius);padding:8px 16px;color:#fff;font-family:var(--font);font-size:13px;cursor:pointer;transition:opacity var(--trans)}
.btn-danger:hover{opacity:.8}
.btn-success{background:linear-gradient(135deg,var(--green2),var(--green3));border:none;border-radius:var(--radius);padding:8px 16px;color:#fff;font-family:var(--font);font-size:13px;cursor:pointer;transition:opacity var(--trans)}
.btn-success:hover{opacity:.8}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;color:var(--text2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all var(--trans)}
.btn-icon:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.05)}
/* APP LAYOUT */
#app{display:none;height:100vh;flex-direction:column}
/* TOP BAR */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.topbar-brand{font-family:var(--display);font-size:18px;font-weight:900;color:var(--cyan);letter-spacing:4px;white-space:nowrap}
.topbar-sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.topbar-role{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.topbar-search{flex:1;max-width:320px;position:relative}
.topbar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px 6px 34px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color var(--trans)}
.topbar-search input:focus{border-color:var(--cyan)}
.topbar-search::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.notif-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;position:relative;transition:all var(--trans)}
.notif-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan2),var(--blue2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border2)}
/* MAIN LAYOUT */
.main-layout{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width var(--trans)}
@media(max-width:900px){.sidebar{width:52px}}
@media(max-width:600px){.sidebar{position:fixed;left:-220px;top:52px;bottom:0;z-index:200;width:220px;transition:left var(--trans)}.sidebar.open{left:0}}
.sidebar-section{padding:12px 8px 4px;font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;transition:all var(--trans);margin:1px 8px;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(0,212,255,.06);color:var(--cyan)}
.nav-item.active{background:rgba(0,212,255,.1);color:var(--cyan);border-left:2px solid var(--cyan)}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.nav-label{font-size:13px;overflow:hidden}
@media(max-width:900px){.nav-label,.sidebar-section{display:none}}
/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px}
@media(max-width:600px){.content{padding:12px}}
/* PAGES */
.page{display:none}
.page.active{display:block}
/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-title small{font-size:12px;color:var(--text3);font-weight:400;margin-left:8px;letter-spacing:1px;text-transform:uppercase}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
/* GRID */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
@media(max-width:600px){.grid-4{grid-template-columns:1fr 1fr}}
/* STAT CARD */
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--cyan))}
.stat-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:var(--text);font-family:var(--mono);line-height:1}
.stat-sub{font-size:12px;color:var(--text3);margin-top:6px}
.stat-trend{font-size:12px;font-weight:600}
.stat-trend.up{color:var(--green)}
.stat-trend.down{color:var(--red)}
/* MAP */
.map-container{border-radius:var(--radius2);overflow:hidden;border:1px solid var(--border);position:relative}
#map-main,#map-sale,#map-mini,.leaflet-map{height:100%;width:100%}
.leaflet-container{background:#07090f!important}
.map-overlay{position:absolute;top:10px;left:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-legend{background:rgba(13,17,23,.9);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.map-controls{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-btn{background:rgba(13,17,23,.9);border:1px solid var(--border2);border-radius:var(--radius);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2);transition:all var(--trans)}
.map-btn:hover{border-color:var(--cyan);color:var(--cyan)}
/* PULSAR ANIMATION */
@keyframes pulse-ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.7}}
.pulse-ring{animation:pulse-ring 1.5s cubic-bezier(.215,.61,.355,1) infinite}
.pulse-dot{animation:pulse-dot 1.5s ease infinite}
/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.badge-ok{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.2)}
.badge-warn{background:rgba(255,171,0,.12);color:var(--amber);border:1px solid rgba(255,171,0,.2)}
.badge-danger{background:rgba(255,68,68,.12);color:var(--red);border:1px solid rgba(255,68,68,.2)}
.badge-info{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.badge-off{background:rgba(90,114,144,.1);color:var(--text3);border:1px solid var(--border)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
/* TABLES */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:8px 12px;color:var(--text3);font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:500}
.data-table td{padding:10px 12px;border-bottom:1px solid rgba(30,45,66,.5);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(0,212,255,.03)}
.data-table-wrap{overflow-x:auto}
/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:16px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all var(--trans)}
.tab.active{background:var(--card2);color:var(--cyan);font-weight:600}
.tab:hover:not(.active){color:var(--text)}
/* FORM ELEMENTS */
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field label{font-size:12px;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
.form-field input,.form-field select,.form-field textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color var(--trans)}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,212,255,.08)}
.form-field select option{background:var(--bg3)}
.form-field textarea{resize:vertical;min-height:80px}
/* ALERT */
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-danger{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.2);color:var(--red)}
.alert-warn{background:rgba(255,171,0,.1);border:1px solid rgba(255,171,0,.2);color:var(--amber)}
.alert-info{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.15);color:var(--cyan)}
.alert-success{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.15);color:var(--green)}
/* NOTIFICATIONS PANEL */
.notif-panel{position:fixed;top:52px;right:0;width:320px;height:calc(100vh - 52px);background:var(--panel);border-left:1px solid var(--border);z-index:300;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto}
.notif-panel.open{transform:none}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--trans)}
.notif-item:hover{background:rgba(0,212,255,.04)}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:4px;height:4px;background:var(--cyan);border-radius:50%}
.notif-item{position:relative}
.notif-time{font-size:11px;color:var(--text3);margin-top:4px}
/* SENSOR GAUGES */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-circle{position:relative;width:90px;height:90px}
.gauge-circle svg{transform:rotate(-90deg)}
.gauge-circle .gauge-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:var(--mono);line-height:1.1}
.gauge-circle .gauge-unit{font-size:9px;color:var(--text3)}
.gauge-name{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
/* CONTAINER LIST ITEM */
.container-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;cursor:pointer;transition:all var(--trans);display:flex;align-items:center;gap:12px}
.container-item:hover{border-color:var(--border3);background:var(--card2);transform:translateY(-1px)}
.container-item.status-ok{border-left:3px solid var(--green)}
.container-item.status-warn{border-left:3px solid var(--amber)}
.container-item.status-danger{border-left:3px solid var(--red)}
.container-item.status-off{border-left:3px solid var(--text3)}
.container-info{flex:1;min-width:0}
.container-id{font-size:14px;font-weight:600;font-family:var(--mono)}
.container-meta{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* PROGRESS BAR */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
/* TIMELINE */
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(30,45,66,.5)}
.timeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.timeline-content{flex:1}
.timeline-text{font-size:13px;color:var(--text)}
.timeline-time{font-size:11px;color:var(--text3);margin-top:3px;font-family:var(--mono)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius3);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700;color:var(--text)}
.modal-close{background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:24px;text-align:center;cursor:pointer;transition:all var(--trans);background:var(--bg3)}
.upload-zone:hover{border-color:var(--cyan);background:rgba(0,212,255,.04)}
.upload-icon{font-size:32px;margin-bottom:8px;color:var(--text3)}
.upload-text{font-size:13px;color:var(--text2)}
/* CHART WRAPPER */
.chart-wrap{position:relative}
/* SCROLLBAR FIX */
.overflow-auto{overflow:auto}
/* SECURITY TOGGLE */
.security-toggle{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2)}
.toggle-switch{position:relative;width:48px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:13px;cursor:pointer;transition:background var(--trans)}
.toggle-slider:before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform var(--trans)}
.toggle-switch input:checked+.toggle-slider{background:var(--cyan)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(22px)}
/* MOBILE MENU BTN */
.mobile-menu-btn{display:none;background:transparent;border:1px solid var(--border);border-radius:var(--radius);width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px}
@media(max-width:600px){.mobile-menu-btn{display:flex}}
/* CHARTS GRID */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.charts-row{grid-template-columns:1fr}}
/* SUBSCRIPTION CARDS */
.sub-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius2);padding:20px;cursor:pointer;transition:all var(--trans);text-align:center}
.sub-card:hover,.sub-card.selected{border-color:var(--cyan);background:rgba(0,212,255,.05)}
.sub-price{font-size:32px;font-weight:700;font-family:var(--display);color:var(--cyan)}
.sub-period{font-size:12px;color:var(--text3)}
/* DATA TILES */
.sensor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sensor-tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;text-align:center;position:relative;overflow:hidden}
.sensor-tile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--sensor-color,var(--cyan))}
.sensor-val{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--text);line-height:1}
.sensor-unit{font-size:11px;color:var(--text3);margin-bottom:4px}
.sensor-label{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}
/* EXPORT BTN */
.export-btn{background:linear-gradient(135deg,rgba(0,212,255,.1),rgba(41,121,255,.1));border:1px solid rgba(0,212,255,.2);border-radius:var(--radius);padding:8px 16px;color:var(--cyan);font-family:var(--font);font-size:13px;cursor:pointer;transition:all var(--trans)}
.export-btn:hover{background:rgba(0,212,255,.15)}
/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin-bottom:12px}
.breadcrumb a{color:var(--cyan);text-decoration:none}
.breadcrumb-sep{color:var(--text3)}
/* TAG */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-text{font-size:15px;color:var(--text2);margin-bottom:8px}
.empty-sub{font-size:13px}
/* SETTINGS */
.settings-section{margin-bottom:24px}
.settings-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(30,45,66,.4)}
.settings-item:last-child{border-bottom:none}
.settings-item-info{flex:1}
.settings-item-label{font-size:14px;color:var(--text)}
.settings-item-desc{font-size:12px;color:var(--text3);margin-top:2px}
/* ALERT PANEL */
#alert-panel{position:fixed;bottom:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.alert-toast{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius2);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;pointer-events:all;animation:slideIn .3s ease;max-width:320px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
.alert-toast-danger{border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.08)}
.alert-toast-warn{border-color:rgba(255,171,0,.3)}
.alert-toast-success{border-color:rgba(0,230,118,.3)}
/* MAP custom markers */
.marker-pulse{width:24px;height:24px;position:relative}
.marker-inner{width:12px;height:12px;border-radius:50%;position:absolute;top:6px;left:6px}
.marker-outer{width:24px;height:24px;border-radius:50%;border:2px solid;position:absolute;top:0;left:0;opacity:.4;animation:pulse-ring 2s ease infinite}
/* CUSTOM LEAFLET */
.leaflet-popup-content-wrapper{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border2)!important;border-radius:var(--radius2)!important;box-shadow:var(--shadow)!important}
.leaflet-popup-tip{background:var(--panel)!important}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}
/* VEHICLE TRACK */
@keyframes move-truck{0%{d:path('M0 0')}100%{d:path('M100 100')}}
/* IMG placeholder */
.img-placeholder{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px}
/* SCROLL FIX */
.overflow-y{overflow-y:auto}
</style>

function doLogin(){
  currentRole = document.getElementById('login-role').value;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initApp();
}

// ===== APP INIT =====
function initApp(){
  const roleLabels={superadmin:'SUPER ADMIN',owner:'PROPRIÉTAIRE BB',company:'ENTREPRISE',driver:'CHAUFFEUR',client:'CLIENT'};
  const roleInit={superadmin:'SA',owner:'PB',company:'EN',driver:'CH',client:'CL'};
  document.getElementById('topbar-role-label').textContent = roleLabels[currentRole]||'';
  document.getElementById('user-avatar').textContent = roleInit[currentRole]||'?';
  buildNav();
  buildNotifications();
  startClock();
  navigateTo(NAV[currentRole][0].id);
  startSensorSimulation();
}

function buildNav(){
  const items = NAV[currentRole]||[];
  let html = '<div style="padding:12px 0">';
  items.forEach(item=>{
    html+=`<div class="nav-item" id="nav-${item.id}" onclick="navigateTo('${item.id}')"><span class="nav-icon">${item.icon}</span><span class="nav-label">${item.label}</span></div>`;
  });
  html+='</div>';
  document.getElementById('nav-container').innerHTML = html;
}

function navigateTo(page){
  if(currentPage===page) return;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+page);
  if(navEl) navEl.classList.add('active');
  currentPage = page;
  renderPage(page);
}

// ===== PAGES RENDERER =====
function renderPage(page){
  const c = document.getElementById('pages-container');
  switch(page){
    case 'dashboard': c.innerHTML = buildDashboard(); break;
    case 'map': c.innerHTML = buildMapPage(); break;
    case 'containers': c.innerHTML = buildContainersPage(); break;
    case 'sell': c.innerHTML = buildSellPage(); break;
    case 'companies': c.innerHTML = buildCompaniesPage(); break;
    case 'clients-sa': case 'clients-own': c.innerHTML = buildClientsPage(); break;
    case 'subscribers': c.innerHTML = buildSubscribersPage(); break;
    case 'drivers': c.innerHTML = buildDriversPage(); break;
    case 'stats': c.innerHTML = buildStatsPage(); break;
    case 'events': c.innerHTML = buildEventsPage(); break;
    case 'blog': c.innerHTML = buildBlogPage(); break;
    case 'settings': c.innerHTML = buildSettingsPage(); break;
    default: c.innerHTML = buildDashboard();
  }
  setTimeout(()=>initPageScripts(page), 50);
}

function initPageScripts(page){
  if(page==='dashboard' || page==='stats') initCharts(page);
  if(page==='map') initMap('map-main', currentRole);

}

function buildContainerCard(c){
  const statusColors={ok:'var(--green)',warning:'var(--amber)',danger:'var(--red)',off:'var(--text3)'};
  const col = statusColors[c.status]||'var(--text3)';
  return `
  <div class="card container-item status-${c.status}" style="display:block;cursor:pointer" onclick="showContainerDetail('${c.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:10px;height:10px;border-radius:50%;background:${col};${c.status!=='off'?'box-shadow:0 0 8px '+col:''}"></div>
        <span style="font-family:var(--display);font-size:16px;color:var(--cyan)">${c.id}</span>
      </div>
      <div style="display:flex;gap:6px">
        <span class="badge badge-${c.status==='ok'?'ok':c.status==='warning'?'warn':c.status==='danger'?'danger':'off'}">${c.status.toUpperCase()}</span>
        ${c.securityOn?'<span class="badge badge-info">🔒 Sécurisé</span>':'<span class="badge badge-off">🔓 Non sécurisé</span>'}
      </div>
    </div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:8px">📍 ${c.route}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">🏢 ${c.company} • 🚛 ${c.driver}</div>
    ${c.status!=='off'?`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:700;font-family:var(--mono);color:${c.temp>32?'var(--red)':c.temp>28?'var(--amber)':'var(--green)'}">${c.temp}</div>
        <div style="font-size:10px;color:var(--text3)">°C</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:700;font-family:var(--mono);color:${c.humidity>75?'var(--red)':c.humidity>65?'var(--amber)':'var(--green)'}">${c.humidity}</div>
        <div style="font-size:10px;color:var(--text3)">%</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:700;font-family:var(--mono);color:var(--text)">${c.speed}</div>
        <div style="font-size:10px;color:var(--text3)">km/h</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:700;font-family:var(--mono);color:${c.shock>5?'var(--red)':c.shock>0?'var(--amber)':'var(--green)'}">${c.shock}</div>
        <div style="font-size:10px;color:var(--text3)">Chocs</div>

    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px">
      <span>${c.progress}%</span><span>Mis à jour: ${c.lastUpdate}</span>

    '<div style="text-align:center;padding:16px;color:var(--text3)">📴 Boîte hors ligne — Dernière sync: '+c.lastUpdate+'</div>'}

// ===== MAP INIT =====
function initMap(mapId, role){
  const el = document.getElementById(mapId);
  if(!el) return;
  if(maps[mapId]){ maps[mapId].remove(); delete maps[mapId]; }
  const center = [5.0, 11.0];
  const map = L.map(mapId, {center, zoom: role==='client'?9:6, zoomControl:false});
  maps[mapId] = map;
  // Dark tile layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO',
    maxZoom:19
  }).addTo(map);
  // Add containers as markers
  const showContainers = currentRole==='client' ? [CONTAINERS[0]] : CONTAINERS;
  showContainers.forEach(c=>{
    if(c.status==='off' && currentRole!=='superadmin') return;
    const color = c.status==='ok'?'#00e676':c.status==='warning'?'#ffab00':c.status==='danger'?'#ff4444':'#5a7290';
    const markerHtml = `<div class="marker-pulse">
      <div class="marker-outer" style="border-color:${color}"></div>
      <div class="marker-inner" style="background:${color};box-shadow:0 0 8px ${color}"></div>
    </div>`;
    const icon = L.divIcon({html:markerHtml,className:'',iconSize:[24,24],iconAnchor:[12,12]});
    const marker = L.marker([c.lat, c.lng], {icon}).addTo(map);
    marker.bindPopup(`
      <div style="font-family:'Space Grotesk',sans-serif;min-width:200px">
        <div style="font-family:'Orbitron',sans-serif;font-size:16px;color:var(--cyan,#00d4ff);margin-bottom:8px">${c.id}</div>
        <div style="color:var(--text,#e2eaf6);font-size:13px;margin:4px 0">📍 ${c.route}</div>
        <div style="color:var(--text,#e2eaf6);font-size:13px;margin:4px 0">🚛 ${c.driver}</div>
        ${c.status!=='off'?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
          <div style="text-align:center;background:rgba(0,0,0,.3);padding:6px;border-radius:6px">
            <div style="font-size:18px;font-weight:700;color:${c.temp>32?'#ff4444':c.temp>28?'#ffab00':'#00e676'}">${c.temp}°C</div>
            <div style="font-size:10px;color:#8fa3bc">TEMP</div>
          </div>
          <div style="text-align:center;background:rgba(0,0,0,.3);padding:6px;border-radius:6px">
            <div style="font-size:18px;font-weight:700;color:#00d4ff">${c.speed}</div>
            <div style="font-size:10px;color:#8fa3bc">KM/H</div>
          </div>
        </div>
        <div style="margin-top:8px;font-size:12px;color:#8fa3bc">Mis à jour: ${c.lastUpdate}</div>
        `:'<div style="color:#5a7290;margin-top:8px">Boîte hors ligne</div>'}
      </div>`);
  });
  // Track lines for moving containers
  showContainers.filter(c=>c.status!=='off'&&c.speed>0).forEach(c=>{
    const startLat = c.lat - 0.8;
    const startLng = c.lng - 0.5;
    const line = L.polyline([[startLat,startLng],[c.lat,c.lng]], {
      color: c.status==='ok'?'#00e676':c.status==='warning'?'#ffab00':'#ff4444',
      weight:2, opacity:0.4, dashArray:'6 4'
    }).addTo(map);
  });
  // Sell map click handler
  if(role==='sell'){
    map.on('click', e=>{
      const coordEl = document.getElementById('map-sale-coords');
      if(coordEl) coordEl.textContent = `📍 Lat: ${e.latlng.lat.toFixed(6)}, Lng: ${e.latlng.lng.toFixed(6)}`;
      map.eachLayer(l=>{ if(l._clickMarker) map.removeLayer(l); });
      const m = L.marker(e.latlng).addTo(map);
      m._clickMarker = true;
    });
  }
}

// ===== CHARTS =====
function initCharts(page){
  const labels24 = Array.from({length:24},(_,i)=>`${i}:00`);
  const randomData = (base,range,len=24)=>Array.from({length:len},()=>+(base+(Math.random()-.5)*range).toFixed(1));
  Chart.defaults.color='#8fa3bc';
  Chart.defaults.borderColor='rgba(30,45,66,0.6)';
  function createChart(id,type,labels,datasets,opts={}){
    const el=document.getElementById(id);
    if(!el) return;
    if(charts[id]) charts[id].destroy();
    charts[id]=new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,labels:{color:'#8fa3bc',boxWidth:12,font:{family:'Space Grotesk',size:11}}},...opts.plugins},scales:{x:{grid:{color:'rgba(30,45,66,.5)'},ticks:{font:{size:10},maxTicksLimit:8}},y:{grid:{color:'rgba(30,45,66,.5)'},ticks:{font:{size:10}},...(opts.y||{})}},animation:{duration:800},...opts}});
    return charts[id];
  }
  // Temp chart
  createChart('chart-temp','line',labels24,[{label:'BN-001',data:randomData(22,6),borderColor:'#00d4ff',backgroundColor:'rgba(0,212,255,.08)',borderWidth:2,fill:true,tension:.4,pointRadius:0},{label:'BN-002',data:randomData(30,8),borderColor:'#ff4444',backgroundColor:'rgba(255,68,68,.05)',borderWidth:2,fill:false,tension:.4,pointRadius:0}]);
  createChart('chart-hum','line',labels24,[{label:'Humidité %',data:randomData(62,15),borderColor:'#2979ff',backgroundColor:'rgba(41,121,255,.08)',borderWidth:2,fill:true,tension:.4,pointRadius:0}]);
  createChart('chart-shock','bar',['00h','04h','08h','12h','16h','20h'],
    [{label:'Chocs',data:[0,1,0,3,2,1],backgroundColor:['#00e676','#ffab00','#00e676','#ff4444','#ffab00','#00e676'],borderRadius:4}]);
  createChart('chart-press','line',labels24,[{label:'Pression hPa',data:randomData(1010,8),borderColor:'#b44dff',backgroundColor:'rgba(180,77,255,.08)',borderWidth:2,fill:true,tension:.4,pointRadius:0}]);
  createChart('chart-speed','line',labels24,[
    {label:'BN-001',data:randomData(65,20),borderColor:'#00d4ff',borderWidth:1.5,fill:false,tension:.4,pointRadius:0},
    {label:'BN-002',data:randomData(55,25),borderColor:'#00e676',borderWidth:1.5,fill:false,tension:.4,pointRadius:0},
    {label:'BN-004',data:randomData(50,20),borderColor:'#ffab00',borderWidth:1.5,fill:false,tension:.4,pointRadius:0},
  ]);
  createChart('chart-revenue','bar',['Jan','Fév','Mar','Avr','Mai','Jun'],[{label:'Recettes (CFA)',data:[380000,420000,395000,510000,480000,825000],backgroundColor:'rgba(0,212,255,.4)',borderColor:'#00d4ff',borderWidth:1,borderRadius:4}]);
  createChart('chart-subs','doughnut',['Choc','Température','Humidité','Vent','Pression'],[{data:[10,5,3,4,2],backgroundColor:['#ff4444','#ffab00','#2979ff','#00e676','#b44dff'],borderWidth:0,hoverOffset:6}],{y:{display:false}});
}

    document.getElementById('modal-root').innerHTML=html;
  } else if(type==='addDriver'){
    const html=`<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal"><div class="modal-header"><div class="modal-title">Nouveau Chauffeur</div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-row"><div class="form-field"><label>Nom Complet</label><input type="text" placeholder="Nom chauffeur"></div><div class="form-field"><label>Téléphone</label><input type="text" placeholder="+237..."></div></div><div class="form-row"><div class="form-field"><label>Email</label><input type="email" placeholder="chauffeur@mail.com"></div><div class="form-field"><label>Conteneur(s)</label><select><option>BN-001</option><option>BN-002</option><option>BN-003</option></select></div></div><div class="form-field" style="margin-bottom:12px"><label>Mot de Passe Initial</label><input type="password" placeholder="••••••••"></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button class="btn-primary" style="width:auto" onclick="showToast('Compte chauffeur créé!','success');closeModal()">Créer le Compte</button></div></div></div>`;
    document.getElementById('modal-root').innerHTML=html;
  } else if(type==='settings'){
    navigateTo('settings');
  } else if(type==='addClient'){
    document.getElementById('modal-root').innerHTML='';
    navigateTo('clients-own');
  }
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// ===== UTILITIES =====
function generateReport(id){
  const c = CONTAINERS.find(x=>x.id===id);
  if(!c) return;
  closeModal();
  showToast(`📄 Rapport ${id} en cours de génération...`,'info');
  setTimeout(()=>showToast('✅ Rapport généré et envoyé par email!','success'),2000);
}

function toggleSecurity(id, state){
  const c = CONTAINERS.find(x=>x.id===id);
  if(c){ c.securityOn=state; }
  showToast(`${id}: Mode sécurisé ${state?'ACTIVÉ 🔒':'DÉSACTIVÉ 🔓'}`, state?'success':'info');
}

function calcSubPrice(sel){
  const prices={transit:'5 000 CFA',month:'15 000 CFA',year:'150 000 CFA'};
  const el=document.getElementById('sub-price-calc');
  if(el) el.value=prices[sel.value]||'5 000 CFA';
}

function selectPeriod(el, period){
  document.querySelectorAll('.sub-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function submitSale(){
  const company = document.getElementById('sell-company')?.value;
  if(!company){showToast('Veuillez remplir le nom de l\'entreprise','warn');return;}
  showToast(`✅ Vente validée pour ${company}! Compte créé.`,'success');
}

function previewFile(input, previewId){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const div=document.getElementById(previewId);
    if(div) div.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:120px;border-radius:var(--radius);margin-top:8px;border:1px solid var(--border)">`;
  };
  reader.readAsDataURL(file);
}

function setTab(el, group, val){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function filterContainers(val){
  document.querySelectorAll('#containers-grid > div').forEach(el=>{
    el.style.display=val===''||el.textContent.toLowerCase().includes(val.toLowerCase())?'block':'none';
  });
}

function filterContainersStatus(status, tabEl){
  if(tabEl){ tabEl.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tabEl.classList.add('active'); }
  document.querySelectorAll('#containers-grid > div').forEach(el=>{
    el.style.display=status==='all'||el.className.includes('status-'+status)?'block':'none';
  });
}

function filterContainersList(val){
  document.querySelectorAll('#containers-sidebar-list .container-item').forEach(el=>{
    el.style.display=val===''||el.textContent.toLowerCase().includes(val.toLowerCase())?'flex':'none';
  });
}

function focusContainer(id){
  const c=CONTAINERS.find(x=>x.id===id);
  if(!c||!maps['map-main']) return;
  maps['map-main'].flyTo([c.lat,c.lng],12,{animate:true,duration:1});
}

function showAllContainers(){
  if(!maps['map-main']) return;
  const bounds=L.latLngBounds(CONTAINERS.map(c=>[c.lat,c.lng]));
  maps['map-main'].fitBounds(bounds.pad(.2));
}

function toggleMapLayer(){
  showToast('Fond de carte modifié','info');
}

function toggleTrails(){
  showToast('Traces GPS: affichage modifié','info');
}

function toggleHeatmap(){
  showToast('Heatmap des alertes: activée','info');
}

function globalSearch(val){
  if(val.length<2) return;
  const results = CONTAINERS.filter(c=>c.id.toLowerCase().includes(val.toLowerCase())||c.company.toLowerCase().includes(val.toLowerCase()));
  if(results.length>0) showToast(`Trouvé: ${results[0].id} — ${results[0].route}`,'info');
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleNotif(){
  document.getElementById('notif-panel').classList.toggle('open');
}

function closeNotif(){
  document.getElementById('notif-panel').classList.remove('open');
}

function buildNotifications(){
  const notifs = [
    {id:1,text:'🔴 CRITIQUE: Choc détecté sur BN-003',sub:'Il y a 2 minutes',sev:'danger'},
    {id:2,text:'⚠️ Température élevée sur BN-002',sub:'Il y a 5 minutes',sev:'warn'},
    {id:3,text:'💨 Vent violent signalé — Axe Bafoussam',sub:'Il y a 12 minutes',sev:'warn'},
    {id:4,text:'✅ BN-001 en route — Tout nominal',sub:'Il y a 18 minutes',sev:'ok'},
  ];
  const html=notifs.map(n=>`
    <div class="notif-item" onclick="closeNotif()">
      <div style="font-size:13px;color:var(--text)">${n.text}</div>
      <div class="notif-time">${n.sub}</div>
    </div>`).join('');
  document.getElementById('notif-list').innerHTML=html;
  document.getElementById('notif-count').textContent=notifs.length;
}

function showToast(msg, type='info'){
  const panel=document.getElementById('alert-panel');
  const icons={info:'ℹ️',success:'✅',warn:'⚠️',danger:'🚨'};
  const toast=document.createElement('div');
  toast.className=`alert-toast alert-toast-${type}`;
  toast.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  panel.appendChild(toast);
  setTimeout(()=>{ toast.style.opacity='0'; toast.style.transition='opacity .3s'; setTimeout(()=>toast.remove(),300); }, 4000);
}

function startClock(){
  function update(){
    const now=new Date();
    const el=document.getElementById('live-time');
    if(el) el.textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  update();
  if(liveInterval) clearInterval(liveInterval);
  liveInterval=setInterval(update,1000);
}

function startSensorSimulation(){
  if(sensorInterval) clearInterval(sensorInterval);
  sensorInterval=setInterval(()=>{
    // Update live sensors randomly
    CONTAINERS.forEach(c=>{
      if(c.status==='off') return;
      c.temp = +(c.temp + (Math.random()-.5)*0.3).toFixed(1);
      c.humidity = Math.min(95,Math.max(30,+(c.humidity+(Math.random()-.5)*0.5).toFixed(1)));
      c.pressure = +(c.pressure+(Math.random()-.5)*0.2).toFixed(1);
      if(c.speed>0) c.speed = Math.max(0,+(c.speed+(Math.random()-.5)*2).toFixed(0));
      c.lat += (Math.random()-.5)*0.003;
      c.lng += (Math.random()-.5)*0.003;
    });
    // Update visible elements
    const t=document.getElementById('live-temp');if(t) t.textContent=CONTAINERS[0].temp;
    const h=document.getElementById('live-hum');if(h) h.textContent=CONTAINERS[0].humidity;
    const p=document.getElementById('live-press');if(p) p.textContent=CONTAINERS[0].pressure;
    const s=document.getElementById('live-speed');if(s) s.textContent=CONTAINERS[0].speed;
    const mt=document.getElementById('map-temp');if(mt) mt.textContent=CONTAINERS[0].temp;
    const dt=document.getElementById('drv-temp');if(dt) dt.textContent=CONTAINERS[0].temp+'°C';
    const dh=document.getElementById('drv-hum');if(dh) dh.textContent=CONTAINERS[0].humidity+'%';
    const ds=document.getElementById('drv-speed');if(ds) ds.textContent=CONTAINERS[0].speed+' km/h';
    // Random temperature alert
    if(Math.random()<.01 && CONTAINERS[0].temp>32) showToast(`⚠️ BN-001: Température haute ${CONTAINERS[0].temp}°C`,'warn');
    // Update chart if exists
    if(charts['chart-temp']&&charts['chart-temp'].data){
      const d=charts['chart-temp'].data.datasets[0].data;
      d.push(CONTAINERS[0].temp);d.shift();
      charts['chart-temp'].update('none');
    }
    // Move markers
    Object.values(maps).forEach(map=>{
      map.eachLayer(l=>{
        if(l instanceof L.Marker){
          const ll=l.getLatLng();
          const c=CONTAINERS.find(c=>Math.abs(c.lat-ll.lat)<0.01&&c.speed>0);
          if(c){ l.setLatLng([c.lat,c.lng]); }
        }
      });
    });
  }, 3000);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') { closeModal(); closeNotif(); }
  if(e.ctrlKey&&e.key==='k'){ e.preventDefault(); document.getElementById('global-search')?.focus(); }
});

// Auto-start
window.onload=()=>{
  // Pre-fill login for demo
  document.getElementById('login-pass').value='••••••••';
};
