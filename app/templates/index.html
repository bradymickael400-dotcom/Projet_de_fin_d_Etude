<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGOS — Black Box Monitoring Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Font Awesome 6 pour icônes professionnelles -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-bg"><div class="login-grid"></div></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">ARGOS</div>
      <div class="sub">Black Box Monitoring Platform</div>
    </div>
    <div class="form-group">
      <label>Identifiant</label>
      <input type="text" id="login-username" placeholder="user@argos.io" required value="">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="login-password" placeholder="••••••••" required value=""><label for="show-password" style="font-size:12px;color:var(--text3);">Afficher le mot de passe</label><input type="checkbox" id="show-password" style="margin-left:8px">
    </div>
    <script>
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById('login-password');
        const showPasswordCheckbox = document.getElementById('show-password');
        if (showPasswordCheckbox.checked) {
          passwordInput.type = 'text';
        } else {
          passwordInput.type = 'password';
        }
      }
      document.getElementById('show-password').addEventListener('change', togglePasswordVisibility);
    </script>
    <button class="btn-primary" onclick="doLogin()"><i class="fas fa-lock"></i> Connexion Sécurisée</button>
    <!-- <p style="text-align:center;margin-top:12px;font-size:12px;color:var(--text3)">Sélectionnez un rôle pour explorer la plateforme</p> -->
    <div id="login-error-message" style="color: red; margin-top: 15px; font-weight: bold;"></div>

  </div>
</div>

<!-- NOTIFICATIONS PANEL -->
<div class="notif-panel" id="notif-panel">
  <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:13px;font-weight:600">Notifications</span>
    <button onclick="closeNotif()" class="btn-icon" style="padding:4px 8px"><i class="fas fa-times"></i></button>
  </div>
  <div id="notif-list"></div>
</div>

<!-- ALERT PANEL -->
<div id="alert-panel"></div>

<!-- MODAL CONTAINER -->
<div id="modal-root"></div>

<!-- APP -->
<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="topbar-brand">ARGOS</div>
    <div class="topbar-sep"></div>
    <span class="topbar-role" id="topbar-role-label">SUPER ADMIN</span>
    <div class="topbar-search">
      <input type="text" placeholder="Rechercher conteneur, entreprise..." id="global-search" oninput="globalSearch(this.value)">
    </div>
    <div class="topbar-actions">
      <center><div id="live-time" style="font-family:var(--mono);font-size:20px;color:var(--cyan);white-space:nowrap;"></div></center>
      <button class="notif-btn" onclick="toggleNotif()" id="notif-btn">
        <i class="fas fa-bell"></i> <span class="notif-badge" id="notif-count">4</span>
      </button>
      <div class="user-avatar" id="user-avatar" onclick="showModal('settings')">SA</div>
    </div>
  </div>

  <div class="main-layout">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div id="nav-container"></div>
    </div>

    <!-- CONTENT AREA -->
    <div class="content" id="content-area">
      <div id="pages-container"></div>
    </div>
  </div>
</div>

<script src="{{url_for('static', filename='js/script.js')}}"></script>
</body>
</html>
